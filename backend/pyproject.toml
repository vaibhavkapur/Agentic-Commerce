[project]
name = "ap-exception-agent"
version = "0.1.0"
description = "Accounts Payable Exception Agent: investigates supplier invoices and prepares evidence-backed payment requests for human approval."
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.150.0",
    "uvicorn[standard]==0.54.0",
    "sqlalchemy==2.1.5",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
    "pypdf==6.21.1",
    "langgraph==1.2.16",
    "langgraph-checkpoint-sqlite==3.1.2",
    "langchain-core==1.6.12",
    "langchain-openai==1.7.2",
    "pyjwt==2.15.1",
    "python-multipart==0.0.32",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.1",
]
postgres = [
    "psycopg[binary]>=3.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]  # FastAPI Depends() idiom; long lines in rule/message text
